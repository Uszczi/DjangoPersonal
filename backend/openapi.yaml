openapi: 3.1.0
info:
  title: DjangoPersonal API
  version: 1.0.0
  description: API for DjangoPersonal projects and tasks.
paths:
  /api/v1/projects/:
    get:
      operationId: projects_list
      summary: List Projects
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Project'
                title: Response
                type: array
      tags:
      - projects
    post:
      operationId: projects_create
      summary: Create Project
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
  /api/v1/projects/{id}/:
    get:
      operationId: projects_retrieve
      summary: Get Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - projects
    put:
      operationId: projects_update
      summary: Replace Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
    patch:
      operationId: projects_partial_update
      summary: Update Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
        required: true
  /api/v1/tasks/:
    get:
      operationId: tasks_list
      summary: List Tasks
      parameters:
      - in: query
        name: project
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Task'
                title: Response
                type: array
      tags:
      - tasks
    post:
      operationId: tasks_create
      summary: Create Task
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
  /api/v1/tasks/{id}/:
    patch:
      operationId: tasks_partial_update
      summary: Update Task
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
      - tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
        required: true
components:
  schemas:
    Project:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        is_inbox:
          readOnly: true
          title: Is Inbox
          type: boolean
      required:
      - id
      - name
      - description
      - is_inbox
      title: Project
      type: object
    ProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
      required:
      - name
      title: ProjectRequest
      type: object
    PatchedProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          title: Description
          type: string
      title: PatchedProjectRequest
      type: object
    Task:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        project:
          readOnly: true
          title: Project
          type: integer
        is_completed:
          readOnly: true
          title: Is Completed
          type: boolean
      required:
      - id
      - title
      - description
      - project
      - is_completed
      title: Task
      type: object
    TaskCreateRequest:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          title: Description
          type: string
        project:
          title: Project
          type: integer
      required:
      - title
      title: TaskCreateRequest
      type: object
    PatchedTaskUpdateRequest:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          title: Description
          type: string
        project:
          title: Project
          type: integer
        is_completed:
          title: Is Completed
          type: boolean
      title: PatchedTaskUpdateRequest
      type: object
servers: []
