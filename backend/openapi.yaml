      tags:
      - personal
      summary: Delete Whiteboard
      operationId: whiteboards_destroy
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
