components:
  schemas:
    AskNotesRequest:
      properties:
        question:
          type: string
          maxLength: 1000
          minLength: 1
          title: Question
      type: object
      required:
      - question
      title: AskNotesRequest
    AttemptRequest:
      properties:
        item:
          type: integer
          title: Item
        outcome:
          type: string
          enum:
          - in_progress
          - finished
          - abandoned
          title: Outcome
        started_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Started On
        ended_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Ended On
        progress:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Progress
      type: object
      required:
      - item
      - outcome
      title: AttemptRequest
      description: 'Start an Attempt (``in_progress``) or record one that has already
        ended.


        The end date is required once it has ended and must be empty while it is in

        progress; the use case checks that, together with the start date.'
    AttemptResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        item_id:
          type: integer
          title: Item Id
          readOnly: true
        outcome:
          type: string
          enum:
          - in_progress
          - finished
          - abandoned
          title: Outcome
        started_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Started On
        ended_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Ended On
        progress:
          anyOf:
          - type: integer
          - type: 'null'
          title: Progress
        created_at:
          type: string
          format: date-time
          title: Created At
          readOnly: true
      type: object
      required:
      - id
      - item_id
      - outcome
      - started_on
      - ended_on
      - progress
      - created_at
      title: AttemptResponse
    AuthResponse:
      properties:
        access:
          type: string
          title: Access
        refresh:
          type: string
          title: Refresh
      type: object
      required:
      - access
      - refresh
      title: AuthResponse
    BibliographyItemRequest:
      properties:
        kind:
          type: string
          enum:
          - film
          - book
          title: Kind
        title:
          type: string
          maxLength: 300
          minLength: 1
          title: Title
        creator:
          type: string
          maxLength: 200
          title: Creator
          default: ''
        year:
          anyOf:
          - type: integer
            maximum: 9999.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Year
        length:
          anyOf:
          - type: integer
            maximum: 1000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Length
        note:
          type: string
          maxLength: 10000
          title: Note
          default: ''
      type: object
      required:
      - kind
      - title
      title: BibliographyItemRequest
    BibliographyItemResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        kind:
          type: string
          enum:
          - film
          - book
          title: Kind
        title:
          type: string
          title: Title
        creator:
          type: string
          title: Creator
        year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Year
        length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Length
        note:
          type: string
          title: Note
        status:
          type: string
          enum:
          - planned
          - in_progress
          - finished
          - abandoned
          title: Status
          readOnly: true
        created_at:
          type: string
          format: date-time
          title: Created At
          readOnly: true
      type: object
      required:
      - id
      - kind
      - title
      - creator
      - year
      - length
      - note
      - status
      - created_at
      title: BibliographyItemResponse
    CategoryRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        icon:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          title: Icon
          default: tag
      type: object
      required:
      - name
      title: CategoryRequest
    CategoryResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        name:
          type: string
          title: Name
        icon:
          type: string
          title: Icon
        is_system:
          type: boolean
          title: Is System
          default: false
          readOnly: true
      type: object
      required:
      - id
      - name
      - icon
      title: CategoryResponse
    CounterEntryRequest:
      properties:
        counter:
          type: integer
          title: Counter
        value:
          type: integer
          maximum: 1000000000.0
          minimum: -1000000000.0
          title: Value
          default: 1
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        note:
          type: string
          maxLength: 1000
          title: Note
          default: ''
      type: object
      required:
      - counter
      - occurred_at
      title: CounterEntryRequest
    CounterEntryResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        counter_id:
          type: integer
          title: Counter Id
          readOnly: true
        value:
          type: integer
          title: Value
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        note:
          type: string
          title: Note
      type: object
      required:
      - id
      - counter_id
      - value
      - occurred_at
      - note
      title: CounterEntryResponse
    CounterRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
      type: object
      required:
      - name
      title: CounterRequest
    CounterResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        name:
          type: string
          title: Name
        created_at:
          type: string
          format: date-time
          title: Created At
          readOnly: true
        entry_count:
          type: integer
          title: Entry Count
          readOnly: true
        total:
          type: integer
          title: Total
          readOnly: true
        streak_days:
          type: integer
          title: Streak Days
          readOnly: true
        days_since_last_entry:
          anyOf:
          - type: integer
          - type: 'null'
          title: Days Since Last Entry
          readOnly: true
      type: object
      required:
      - id
      - name
      - created_at
      - entry_count
      - total
      - streak_days
      - days_since_last_entry
      title: CounterResponse
    FolderRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - name
      title: FolderRequest
    FolderResponse:
      properties:
        id:
          type: integer
          title: Id
          readOnly: true
        name:
          type: string
          title: Name
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
        created_at:
          type: string
          format: date-time
          title: Created At
          readOnly: true
      type: object
      required:
      - id
      - name
      - created_at
      title: FolderResponse
    LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    LoginResponse:
      properties:
        access:
          type: string
          title: Access
        refresh:
          type: string
          title: Refresh
      type: object
      required:
      - access
      - refresh
      title: LoginResponse
    MatchingLine:
      properties:
        number:
          type: integer
          title: Number
        text:
          type: string
          title: Text
      type: object
      required:
      - number
      - text
      title: MatchingLine
      description: One line of a Notatka that matched a search, numbered from 1.
    NoteSource:
      properties:
        number:
          type: integer
          title: Number
        whiteboard_id:
          type: integer
          title: Whiteboard Id
        heading:
          type: string
          title: Heading
        text:
          type: string
          title: Text
        score:
          type: number
          title: Score
      type: object
      required:
      - number
      - whiteboard_id
      - heading
      - text
      - score
      title: NoteSource
      description: A Chunk the answer cites, under the number it is cited by (``[1]``).
    NotesAnswer:
      properties:
        answer:
          type: string
          title: Answer
        sources:
          items:
            $ref: '#/components/schemas/NoteSource'
          type: array
          title: Sources
      type: object
      required:
      - answer
      - sources
      title: NotesAnswer
    PatchedAttemptRequest:
      properties:
        outcome:
          anyOf:
          - type: string
            enum:
            - in_progress
            - finished
            - abandoned
          - type: 'null'
          title: Outcome
        started_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Started On
        ended_on:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Ended On
        progress:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Progress
      additionalProperties: false
      type: object
      title: PatchedAttemptRequest
      description: 'Finish, abandon, re-date or move on an Attempt; it stays on its
        BibliographyItem.


        ``progress`` is a page (book) or minute (film), set only while in progress;

        ``null`` clears it.'
    PatchedBibliographyItemRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 1
          - type: 'null'
          title: Title
        creator:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Creator
        year:
          anyOf:
          - type: integer
            maximum: 9999.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Year
        length:
          anyOf:
          - type: integer
            maximum: 1000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Length
        note:
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      title: PatchedBibliographyItemRequest
      description: 'The kind is fixed at creation, so it is not a field here: sending
        it is an error.'
    PatchedCategoryRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        icon:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          - type: 'null'
          title: Icon
      type: object
      title: PatchedCategoryRequest
    PatchedCounterEntryRequest:
      properties:
        value:
          anyOf:
          - type: integer
            maximum: 1000000000.0
            minimum: -1000000000.0
          - type: 'null'
          title: Value
        occurred_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Occurred At
        note:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Note
      type: object
      title: PatchedCounterEntryRequest
    PatchedCounterRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
      type: object
      title: PatchedCounterRequest
    PatchedFolderRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent Id
      type: object
      title: PatchedFolderRequest
    PatchedProjectRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        position:
          anyOf:
          - type: integer
          - type: 'null'
          title: Position
        project_statuses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Project Statuses
        terminal_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Terminal Status
      type: object
      title: PatchedProjectRequest
    PatchedTaskUpdateRequest:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        project:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        position:
          anyOf:
          - type: integer
          - type: 'null'
          title: Position
      type: object
      title: PatchedTaskUpdateRequest
    PatchedTimeEntryRequest:
      properties:
        task:
          anyOf:
          - type: integer
          - type: 'null'
          title: Task
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
        duration_minutes:
          anyOf:
          - type: integer
            maximum: 1440.0
            minimum: 1.0
          - type: 'null'
          title: Duration Minutes
      type: object
