  /api/v1/notes/ask/:
    post:
      tags:
      - personal
      summary: Ask Notes
      description: 'Answer ``question`` from the user''s Notatki, with the Chunks
        the answer cites

        (``sources``). Nothing relevant found: the answer says so and ``sources``
        is empty.

        503 when the embedding or answer model is unavailable or not configured.'
      operationId: notes_ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskNotesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesAnswer'
      security:
      - JWTAuth: []
