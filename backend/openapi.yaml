      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
  /api/v1/time-entries/:
    get:
      tags:
      - personal
      summary: List Time Entries
      operationId: time_entries_list
      security:
      - JWTAuth: []
      parameters:
