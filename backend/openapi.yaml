openapi: 3.1.0
info:
  title: DjangoPersonal API
  version: 1.0.0
  description: API for DjangoPersonal projects and tasks.
paths:
  /api/v1/auth/register/:
    post:
      operationId: auth_register
      summary: Register
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      summary: Login
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      summary: Refresh
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      summary: Me
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      tags:
      - personal
      security:
      - JWTAuth: []
  /api/v1/projects/:
    get:
      operationId: projects_list
      summary: List Projects
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: projects_create
      summary: Create Project
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
  /api/v1/projects/{id}/:
    get:
      operationId: projects_retrieve
      summary: Get Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      tags:
      - personal
    put:
      operationId: projects_update
      summary: Replace Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
    patch:
      operationId: projects_partial_update
      summary: Update Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
        required: true
    delete:
      operationId: projects_destroy
      summary: Delete Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
  /api/v1/tasks/:
    get:
      operationId: tasks_list
      summary: List Tasks
      parameters:
      - in: query
        name: project
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
        required: false
      - in: query
        name: all
        schema:
          default: false
          title: All
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TaskResponse'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: tasks_create
      summary: Create Task
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
  /api/v1/tasks/{id}/:
    patch:
      operationId: tasks_partial_update
      summary: Update Task
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
        required: true
    delete:
      operationId: tasks_destroy
      summary: Delete Task
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
  /api/v1/time-entries/:
    get:
      operationId: time_entries_list
      summary: List Time Entries
      parameters:
      - in: query
        name: task
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Task
        required: false
      - in: query
        name: date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TimeEntryResponse'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: time_entries_create
      summary: Create Time Entry
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryCreateRequest'
        required: true
  /api/v1/time-entries/{id}/:
    patch:
      operationId: time_entries_partial_update
      summary: Update Time Entry
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTimeEntryRequest'
        required: true
    delete:
      operationId: time_entries_destroy
      summary: Delete Time Entry
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
  /api/v1/timer/start/:
    post:
      operationId: timer_start
      summary: Start Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerResponse'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStartRequest'
        required: true
  /api/v1/timer/:
    get:
      operationId: timer_retrieve
      summary: Get Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerResponse'
      tags:
      - personal
  /api/v1/timer/stop/:
    post:
      operationId: timer_stop
      summary: Stop Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerResponse'
      tags:
      - personal
components:
  schemas:
    AuthResponse:
      properties:
        access:
          title: Access
          type: string
        refresh:
          title: Refresh
          type: string
      required:
      - access
      - refresh
      title: AuthResponse
      type: object
    RegisterRequest:
      properties:
        username:
          maxLength: 150
          minLength: 1
          title: Username
          type: string
        password:
          minLength: 1
          title: Password
          type: string
        password_confirm:
          minLength: 1
          title: Password Confirm
          type: string
      required:
      - username
      - password
      - password_confirm
      title: RegisterRequest
      type: object
    LoginResponse:
      properties:
        access:
          title: Access
          type: string
        refresh:
          title: Refresh
          type: string
      required:
      - access
      - refresh
      title: LoginResponse
      type: object
    LoginRequest:
      properties:
        username:
          title: Username
          type: string
        password:
          title: Password
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    RefreshResponse:
      properties:
        access:
          title: Access
          type: string
      required:
      - access
      title: RefreshResponse
      type: object
    RefreshRequest:
      properties:
        refresh:
          title: Refresh
          type: string
      required:
      - refresh
      title: RefreshRequest
      type: object
    UserResponse:
      properties:
        id:
          title: Id
          type: integer
        username:
          title: Username
          type: string
      required:
      - id
      - username
      title: UserResponse
      type: object
    ProjectResponse:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        is_inbox:
          readOnly: true
          title: Is Inbox
          type: boolean
      required:
      - id
      - name
      - description
      - is_inbox
      title: ProjectResponse
      type: object
    ProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
      required:
      - name
      title: ProjectRequest
      type: object
    PatchedProjectRequest:
      properties:
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      title: PatchedProjectRequest
      type: object
    TaskResponse:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        project_id:
          readOnly: true
          title: Project Id
          type: integer
        is_completed:
          readOnly: true
          title: Is Completed
          type: boolean
      required:
      - id
      - title
      - description
      - project_id
      - is_completed
      title: TaskResponse
      type: object
    TaskCreateRequest:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          title: Description
          type: string
        project:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
      required:
      - title
      title: TaskCreateRequest
      type: object
    PatchedTaskUpdateRequest:
      properties:
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        project:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
        is_completed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Completed
      title: PatchedTaskUpdateRequest
      type: object
    TimeEntryResponse:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        task_id:
          readOnly: true
          title: Task Id
          type: integer
        start:
          format: date-time
          title: Start
          type: string
        end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End
      required:
      - id
      - task_id
      - start
      title: TimeEntryResponse
      type: object
    TimeEntryCreateRequest:
      properties:
        task:
          title: Task
          type: integer
        date:
          format: date
          title: Date
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          title: Duration Minutes
          type: integer
      required:
      - task
      - date
      - duration_minutes
      title: TimeEntryCreateRequest
      type: object
    PatchedTimeEntryRequest:
      properties:
        task:
          anyOf:
          - type: integer
          - type: 'null'
          title: Task
        date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
        duration_minutes:
          anyOf:
          - maximum: 1440
            minimum: 1
            type: integer
          - type: 'null'
          title: Duration Minutes
      title: PatchedTimeEntryRequest
      type: object
    TimerResponse:
      properties:
        entry:
          anyOf:
          - $ref: '#/components/schemas/TimeEntryResponse'
          - type: 'null'
        server_now:
          format: date-time
          title: Server Now
          type: string
      required:
      - server_now
      title: TimerResponse
      type: object
    TimerStartRequest:
      properties:
        task:
          title: Task
          type: integer
      required:
      - task
      title: TimerStartRequest
      type: object
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
servers: []
