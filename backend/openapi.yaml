openapi: 3.1.0
info:
  title: DjangoPersonal API
  description: API for DjangoPersonal projects, tasks, and expenses.
  version: 1.0.0
paths:
  /api/v1/auth/register/:
    post:
      tags:
      - personal
      summary: Register
      operationId: auth_register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/v1/auth/login/:
    post:
      tags:
      - personal
      summary: Login
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /api/v1/auth/refresh/:
    post:
      tags:
      - personal
      summary: Refresh
      operationId: auth_refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
  /api/v1/auth/me/:
    get:
      tags:
      - personal
      summary: Me
      operationId: auth_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - JWTAuth: []
    delete:
      tags:
      - personal
      summary: Destroy
      operationId: auth_destroy
      responses:
        '204':
          description: Successful Response
      security:
      - JWTAuth: []
  /api/v1/projects/:
    get:
      tags:
      - personal
      summary: List Projects
      operationId: projects_list
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                type: array
                title: Response Projects List
      security:
      - JWTAuth: []
    post:
      tags:
      - personal
      summary: Create Project
      operationId: projects_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
      security:
      - JWTAuth: []
  /api/v1/projects/{id}/:
    get:
      tags:
      - personal
      summary: Get Project
      operationId: projects_retrieve
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    put:
      tags:
      - personal
      summary: Replace Project
      operationId: projects_update
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    patch:
      tags:
      - personal
      summary: Update Project
      operationId: projects_partial_update
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    delete:
      tags:
      - personal
      summary: Delete Project
      operationId: projects_destroy
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
  /api/v1/tasks/:
    get:
      tags:
      - personal
      summary: List Tasks
      operationId: tasks_list
      security:
      - JWTAuth: []
      parameters:
      - name: project
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
                title: Response Tasks List
    post:
      tags:
      - personal
      summary: Create Task
      operationId: tasks_create
      security:
      - JWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
  /api/v1/tasks/{id}/:
    patch:
      tags:
      - personal
      summary: Update Task
      operationId: tasks_partial_update
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
    delete:
      tags:
      - personal
      summary: Delete Task
      operationId: tasks_destroy
      security:
