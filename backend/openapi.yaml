openapi: 3.1.0
info:
  title: DjangoPersonal API
  version: 1.0.0
  description: API for DjangoPersonal projects and tasks.
paths:
  /api/v1/projects/:
    get:
      operationId: projects_list
      summary: List Projects
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Project'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: projects_create
      summary: Create Project
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
  /api/v1/projects/{id}/:
    get:
      operationId: projects_retrieve
      summary: Get Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - personal
    put:
      operationId: projects_update
      summary: Replace Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
    patch:
      operationId: projects_partial_update
      summary: Update Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
        required: true
    delete:
      operationId: projects_destroy
      summary: Delete Project
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
  /api/v1/tasks/:
    get:
      operationId: tasks_list
      summary: List Tasks
      parameters:
      - in: query
        name: project
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project
        required: false
      - in: query
        name: all
        schema:
          default: false
          title: All
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Task'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: tasks_create
      summary: Create Task
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
  /api/v1/tasks/{id}/:
    patch:
      operationId: tasks_partial_update
      summary: Update Task
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
        required: true
    delete:
      operationId: tasks_destroy
      summary: Delete Task
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
  /api/v1/time-entries/:
    get:
      operationId: time_entries_list
      summary: List Time Entries
      parameters:
      - in: query
        name: task
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Task
        required: false
      - in: query
        name: date
        schema:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TimeEntry'
                title: Response
                type: array
      tags:
      - personal
    post:
      operationId: time_entries_create
      summary: Create Time Entry
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryCreateRequest'
        required: true
  /api/v1/timer/start/:
    post:
      operationId: timer_start
      summary: Start Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerState'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStartRequest'
        required: true
  /api/v1/timer/:
    get:
      operationId: timer_retrieve
      summary: Get Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerState'
      tags:
      - personal
  /api/v1/timer/stop/:
    post:
      operationId: timer_stop
      summary: Stop Timer
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimerState'
      tags:
      - personal
  /api/v1/time-entries/{id}/:
    patch:
      operationId: time_entries_partial_update
      summary: Update Time Entry
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
      tags:
      - personal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTimeEntryRequest'
        required: true
    delete:
      operationId: time_entries_destroy
      summary: Delete Time Entry
      parameters:
      - in: path
        name: id
        schema:
          title: Id
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - personal
components:
  schemas:
    Project:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        is_inbox:
          readOnly: true
          title: Is Inbox
          type: boolean
      required:
      - id
      - name
      - description
      - is_inbox
      title: Project
      type: object
    ProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
      required:
      - name
      title: ProjectRequest
      type: object
    PatchedProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          title: Description
          type: string
      title: PatchedProjectRequest
      type: object
    Task:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        project:
          readOnly: true
          title: Project
          type: integer
        is_completed:
          readOnly: true
          title: Is Completed
          type: boolean
      required:
      - id
      - title
      - description
      - project
      - is_completed
      title: Task
      type: object
    TaskCreateRequest:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          title: Description
          type: string
        project:
          title: Project
          type: integer
      required:
      - title
      title: TaskCreateRequest
      type: object
    PatchedTaskUpdateRequest:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          title: Description
          type: string
        project:
          title: Project
          type: integer
        is_completed:
          title: Is Completed
          type: boolean
      title: PatchedTaskUpdateRequest
      type: object
    TimeEntry:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        task:
          readOnly: true
          title: Task
          type: integer
        start:
          format: date-time
          title: Start
          type: string
        end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End
      required:
      - id
      - task
      - start
      title: TimeEntry
      type: object
    TimeEntryCreateRequest:
      properties:
        task:
          title: Task
          type: integer
        date:
          format: date
          title: Date
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          title: Duration Minutes
          type: integer
      required:
      - task
      - date
      - duration_minutes
      title: TimeEntryCreateRequest
      type: object
    TimerState:
      properties:
        entry:
          anyOf:
          - $ref: '#/components/schemas/TimeEntry'
          - type: 'null'
        server_now:
          format: date-time
          title: Server Now
          type: string
      required:
      - server_now
      title: TimerState
      type: object
    TimerStartRequest:
      properties:
        task:
          title: Task
          type: integer
      required:
      - task
      title: TimerStartRequest
      type: object
    PatchedTimeEntryRequest:
      properties:
        task:
          title: Task
          type: integer
        date:
          format: date
          title: Date
          type: string
        duration_minutes:
          maximum: 1440
          minimum: 1
          title: Duration Minutes
          type: integer
      title: PatchedTimeEntryRequest
      type: object
servers: []
