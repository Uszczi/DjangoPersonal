  /api/v1/counters/:
    get:
      tags:
      - personal
      summary: List Counters
      operationId: counters_list
      security:
      - JWTAuth: []
      parameters:
      - name: tz
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: zoneinfo
          - type: 'null'
          description: IANA time zone where days begin, e.g. Europe/Warsaw (default
            UTC).
          title: Tz
        description: IANA time zone where days begin, e.g. Europe/Warsaw (default
          UTC).
      responses:
