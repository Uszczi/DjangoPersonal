components:
  schemas:
    AuthResponse:
      properties:
        access:
          title: Access
          type: string
        refresh:
          title: Refresh
          type: string
      required:
      - access
      - refresh
      title: AuthResponse
      type: object
    RegisterRequest:
      properties:
        username:
          maxLength: 150
          minLength: 1
          title: Username
          type: string
        password:
          minLength: 1
          title: Password
          type: string
        password_confirm:
          minLength: 1
          title: Password Confirm
          type: string
      required:
      - username
      - password
      - password_confirm
      title: RegisterRequest
      type: object
    LoginResponse:
      properties:
        access:
          title: Access
          type: string
        refresh:
          title: Refresh
          type: string
      required:
      - access
      - refresh
      title: LoginResponse
      type: object
    LoginRequest:
      properties:
        username:
          title: Username
          type: string
        password:
          title: Password
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    RefreshResponse:
      properties:
        access:
          title: Access
          type: string
      required:
      - access
      title: RefreshResponse
      type: object
    RefreshRequest:
      properties:
        refresh:
          title: Refresh
          type: string
      required:
      - refresh
      title: RefreshRequest
      type: object
    UserResponse:
      properties:
        id:
          title: Id
          type: integer
        username:
          title: Username
          type: string
      required:
      - id
      - username
      title: UserResponse
      type: object
    ProjectResponse:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        is_inbox:
          readOnly: true
          title: Is Inbox
          type: boolean
        position:
          default: 0
          readOnly: true
          title: Position
          type: integer
        project_statuses:
          items:
            type: string
          readOnly: true
          title: Project Statuses
          type: array
        terminal_status:
          readOnly: true
          title: Terminal Status
          type: string
      required:
      - id
      - name
      - description
      - is_inbox
      - project_statuses
      - terminal_status
      title: ProjectResponse
      type: object
    ProjectRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
        position:
          anyOf:
          - type: integer
          - type: 'null'
          title: Position
        project_statuses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Project Statuses
        terminal_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Terminal Status
      required:
      - name
      title: ProjectRequest
      type: object
    PatchedProjectRequest:
      properties:
        name:
          anyOf:
          - maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        position:
          anyOf:
          - type: integer
          - type: 'null'
          title: Position
        project_statuses:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Project Statuses
        terminal_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Terminal Status
      title: PatchedProjectRequest
      type: object
    TaskResponse:
      properties:
        id:
          readOnly: true
          title: Id
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        project_id:
          readOnly: true
          title: Project Id
