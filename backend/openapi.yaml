          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhiteboardResponse'
    patch:
      tags:
      - personal
      summary: Update Whiteboard
      operationId: whiteboards_partial_update
      security:
      - JWTAuth: []
      parameters:
