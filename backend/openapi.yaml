        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
  /api/v1/time-entries/{id}/:
    patch:
      tags:
      - personal
      summary: Update Time Entry
      operationId: time_entries_partial_update
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTimeEntryRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntryResponse'
    delete:
      tags:
      - personal
      summary: Delete Time Entry
      operationId: time_entries_destroy
      security:
      - JWTAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
  /api/v1/timer/start/:
    post:
      tags:
      - personal
      summary: Start Timer
      operationId: timer_start
      requestBody:
        content:
          application/json:
            schema:
