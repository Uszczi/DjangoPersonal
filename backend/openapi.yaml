      operationId: auth_me
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - JWTAuth: []
    delete:
      tags:
      - personal
      summary: Destroy
      operationId: auth_destroy
      responses:
        '204':
          description: Successful Response
      security:
      - JWTAuth: []
