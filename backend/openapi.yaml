  /api/v1/whiteboards/search/:
    get:
      tags:
      - personal
      summary: Search Whiteboards
      description: 'Whiteboards and Notatki whose name matches ``q``, and Notatki
        whose

        text does, with the matching lines; case and diacritics are ignored.'
      operationId: whiteboards_search
      security:
      - JWTAuth: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WhiteboardSearchResult'
                title: Response Whiteboards Search
  /api/v1/whiteboards/{id}/:
    get:
      tags:
      - personal
      summary: Get Whiteboard
      operationId: whiteboards_retrieve
      security:
      - JWTAuth: []
      parameters:
