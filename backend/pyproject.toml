[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "django-ninja-jwt>=5.4.5",
    "fastapi>=0.161.1",
    "mcp[cli]>=1.27.0,<2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
mypy_path = "."
exclude = ["staticfiles/", "apps/.*/migrations/"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["whitenoise.*"]
ignore_missing_imports = true

# factory_boy ships py.typed but its declaration constructors are untyped.
[[tool.mypy.overrides]]
module = ["apps.infra.factories"]
disallow_untyped_calls = false

[tool.django-stubs]
django_settings_module = "config.settings"
