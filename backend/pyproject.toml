[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "mcp[cli]>=1.27.0,<2",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-n auto"

[tool.mypy]
python_version = "3.14"
mypy_path = "."
# mcp_server still runs on Django; it comes back under mypy in migration stage 09.
exclude = ["^mcp_server/"]
strict = true
show_error_codes = true

# factory_boy ships py.typed but its declaration constructors are untyped.
[[tool.mypy.overrides]]
module = ["apps.infra.factories"]
disallow_untyped_calls = false
