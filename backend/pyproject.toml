[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-ninja>=1.7.1",
    "django-ninja-jwt>=5.4.5",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
mypy_path = "."
exclude = ["staticfiles/", "apps/.*/migrations/"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["whitenoise.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
