name: Deploy to VPS

on:
  push:
    branches:
      - master

# One deploy at a time; a newer push waits instead of racing the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.image_prefix }}
      package_prefix: ${{ steps.names.outputs.package_prefix }}

    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: deployment/Dockerfile
          - image: frontend
            dockerfile: deployment/frontend.Dockerfile

    steps:
    - name: Compute image names
      id: names
      # GHCR requires lowercase repository paths.
      run: |
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        repo="${GITHUB_REPOSITORY##*/}"
        repo="${repo,,}"
        echo "image_prefix=ghcr.io/$owner/$repo" >> "$GITHUB_OUTPUT"
        echo "package_prefix=$repo" >> "$GITHUB_OUTPUT"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push ${{ matrix.image }}
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        # No attestation manifests: they show up as extra untagged package
        # versions and only clutter the registry.
        provenance: false
        tags: |
          ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:${{ github.sha }}
          ${{ steps.names.outputs.image_prefix }}-${{ matrix.image }}:latest
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: mikrus
    permissions:
      contents: read
      packages: read

    steps:
    - name: Set repo name as env
      run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Copy files to VPS
      run: |
        rsync -e "ssh -p ${{ secrets.VPS_PORT }}" -avz --delete --exclude .git ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/${{ secrets.VPS_USER }}/pp/${{ env.REPO_NAME }}/

    - name: Deploy on VPS
      # The job token is piped over stdin so it never lands in a command line;
      # deploy.sh logs in, pulls, and logs out again (the token expires with
      # this job anyway).
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
          "cd /${{ secrets.VPS_USER }}/pp/${{ env.REPO_NAME }} && \
           IMAGE_PREFIX='${{ needs.build.outputs.image_prefix }}' \
           IMAGE_TAG='${{ github.sha }}' \
           REGISTRY_USER='${{ github.actor }}' \
           ./deployment/deploy.sh"

  cleanup:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        image: [backend, frontend]

    steps:
    - name: Prune old ${{ matrix.image }} images
      uses: actions/delete-package-versions@v5
      with:
        package-name: ${{ needs.build.outputs.package_prefix }}-${{ matrix.image }}
        package-type: container
        # Keep a few recent versions for rollback (IMAGE_TAG=<sha> deploy.sh).
        min-versions-to-keep: 5
