# Local-development override. Never use on the VPS: production traffic goes
# through the host nginx configured by ../update_nginx.sh, and this service
# would fight it for port 80.
#
# Usage:
#   docker compose -f deployment/docker-compose.yml \
#                  -f deployment/docker-compose.local.yml up --detach
services:
  # The mobile app (`just mobile`) points at the Expo dev host on port 8000 by
  # default. The base file publishes the API on 127.0.0.1 only, so a phone on
  # the LAN cannot reach it; republish on all interfaces and accept any host.
  # Local-only: the base file's loopback binding stays in effect on the VPS.
  app:
    ports: !override
      - "8000:8000"
    environment:
      ALLOWED_HOSTS: "*"

  nginx:
    image: nginx:1.27-alpine
    container_name: deployment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend

  # Keep the local stack's dumps in a volume instead of /var/backups.
  backup:
    volumes:
      - backups-local:/backups

volumes:
  backups-local:
