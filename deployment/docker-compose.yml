services:
  app:
    build:
      context: ..
      dockerfile: ./deployment/Dockerfile
    container_name: djangopersonal-app
    restart: unless-stopped
    # Loopback only: the host nginx proxies to 127.0.0.1:8000, and uvicorn
    # trusts X-Forwarded-For from any peer (the Dockerfile's
    # --forwarded-allow-ips '*'; published traffic arrives from the docker
    # bridge, not 127.0.0.1). Published publicly, anyone could pick the client
    # IP the login throttle counts by.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # `app` lets Prometheus scrape app:8000/metrics inside the compose network.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},app
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Traces go to Alloy (→ Tempo); set it empty in .env to turn tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318}
      # Login rate limits, shared by every worker and the MCP server.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: ..
      dockerfile: ./deployment/Dockerfile
    container_name: djangopersonal-mcp
    restart: unless-stopped
    # Loopback only, like `app`: it trusts X-Forwarded-For from any peer.
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},mcp
      MCP_PORT: "8001"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Trust X-Forwarded-For from the reverse proxy (as the app's
      # --forwarded-allow-ips does), so /login throttles the browser's IP.
      # Safe only because the port is published on loopback (above).
      FORWARDED_ALLOW_IPS: "*"
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["sh", "-c", "exec python -m personal.entrypoints.mcp"]

  # Admin panel (sqladmin). Published on the host's loopback only: reach it
  # through an SSH tunnel (ssh -L 8002:127.0.0.1:8002 <vps>), not via nginx.
  admin:
    build:
      context: ..
      dockerfile: ./deployment/Dockerfile
    container_name: djangopersonal-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://alloy:4318}
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "exec uvicorn --factory personal.entrypoints.admin.app:create_served_app --host 0.0.0.0 --port 8002 --proxy-headers --forwarded-allow-ips '*'"]

  frontend:
    build:
      context: ..
      dockerfile: ./deployment/frontend.Dockerfile
    container_name: djangopersonal-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app

  mongodb:
    image: mongo
    container_name: djangopersonal-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    container_name: djangopersonal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--appendonly", "yes"]

  db:
    # postgres:17 plus the pgvector extension, on the same Debian (trixie) as
    # postgres:17, so the glibc collations of an existing volume stay the same.
    image: pgvector/pgvector:pg17-trixie
    container_name: djangopersonal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djangopersonal_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:latest
    container_name: djangopersonal-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  prometheus:
    image: prom/prometheus:latest
    container_name: djangopersonal-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: djangopersonal-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-grafanapassword12!}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - alloy

  loki:
    image: grafana/loki:2.9.4
    container_name: djangopersonal-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: djangopersonal-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "3200:3200"   # HTTP (querier/query-frontend API, metrics)
      - "9095:9095"   # gRPC (query-frontend <-> querier)
    volumes:
      - ./observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  alloy:
    image: grafana/alloy:latest
    container_name: djangopersonal-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.river
    ports:
      - "4317:4317" # OTLP gRPC (aplikacje → Alloy)
      - "4318:4318" # OTLP HTTP (aplikacje → Alloy)
      - "12345:12345" # Alloy UI (opcjonalnie)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # autodiscovery kontenerów
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/alloy.river:/etc/alloy/config.river:ro
    depends_on:
      - loki
      - tempo


volumes:
  redis-data:
  pgdata:
  grafana-storage:
  loki-data:
  tempo-data:
