apiVersion: 1

# Loki and Tempo got fixed uids (the log <-> trace links point at them), but a
# volume made before that holds them under random uids, and Grafana then fails
# provisioning with "data source not found". Deleting them first (applied
# before the inserts below) recreates them with these uids; dashboards look
# datasources up by name, so they keep working.
deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # The backend writes `trace_id=<32 hex>` into every log line
  # (personal/log_config.py; `trace_id=-` outside a span, which never
  # matches); the derived field turns it into a Tempo link.
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id=(\w{32})'
          url: '$${__value.raw}'
          datasourceUid: tempo
          urlDisplayLabel: View trace

  # Traces from the API, MCP server and admin panel (service.name
  # personal-api / personal-mcp / personal-admin), sent through Alloy.
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # Alloy labels every container's logs job="docker".
        customQuery: true
        query: '{job="docker"} |= "trace_id=$${__trace.traceId}"'
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
